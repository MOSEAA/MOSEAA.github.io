# Dev 分支推送部署预览
## 仅部署 Win 端
name: Build Dev

on:
  push:
    branches:
      - dev
      - master

jobs:
  release:
    name: Build Website
    runs-on: windows-latest

    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v4.1.1
      # 安装 Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "18.x"
      # 复制环境变量文件
      - name: Copy .env.example
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          } else {
            Write-Host ".env file already exists. Skipping the copy step."
          }
      # 安装项目依赖
      - name: Install Dependencies
        run: npm install
      # 构建程序
      - name: Build Website
        run: npm run build
        env:
          GITHUB_TOKEN:  ${{ secrets.ACCESS_TOKEN }}
      # 复制构建产物到 docs 目录（GitHub Pages 源目录）
      - name: Copy build output to docs directory
        run: |
          # 创建 docs 目录（若不存在）
          New-Item -ItemType Directory -Path docs -Force
          # 复制 dist 目录下所有文件到 docs 目录
          Copy-Item -Path dist/* -Destination docs/ -Recurse -Force
      # 配置 Git 提交信息
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      # 提交 docs 目录变更
      - name: Commit docs changes
        run: |
          git add docs/
          git commit -m "Update docs with latest build [skip ci]" || echo "No changes to commit"
      # 推送变更到当前分支
      - name: Push changes to branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          branch: ${{ github.ref }}
      # 上传构建产物（仅保留必要的一个）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Home
          path: dist